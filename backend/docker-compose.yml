services:
  db:
    image: postgres:16-alpine
    container_name: radio_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Décommenter UNIQUEMENT pour du debug local (DBeaver, psql...). Jamais en prod.
    # ports:
    #   - "5432:5432"

  api:
    build: .
    container_name: radio_api
    restart: unless-stopped
    env_file: .env
    environment:
      # "db" = nom du service, résolu par le réseau interne de Compose
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_DIR: /app/media
    volumes:
      - ./app:/app/app        # code monté : --reload voit les modifications
      - ./media:/app/media    # images uploadées, persistées sur l'hôte
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
